const V={
home(){const h=new Date().getHours(),g=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер',td=today(),tt=S.tasks.filter(t=>t.date===td),dn=tt.filter(t=>t.st===2).length,p=tt.length?Math.round(dn/tt.length*100):0,up=S.tasks.filter(t=>t.st!==2).sort((a,b)=>(a.date||'9')>(b.date||'9')?1:-1).slice(0,4),ts=S.sched.filter(x=>x.d===(new Date().getDay()+6)%7).sort((a,b)=>a.s>b.s?1:-1);

tasks(){const td=today(),wk=new Date(Date.now()+7*864e5).toISOString().slice(0,10);let l=S.tasks.filter(t=>(!F.q||t.t.toLowerCase().includes(F.q.toLowerCase()))&&(!F.sub||t.sub===F.sub)&&(F.st===''||t.st==F.st)&&(F.view==='all'||(F.view==='today'&&t.date===td)||(F.view==='late'&&t.st!==2&&t.date&&t.date<td)||(F.view==='week'&&t.date>=td&&t.date<=wk)));

set(){return`<h1>Настройки</h1><div class="card glass" style="margin-top:16px"><h2>Имя</h2><input value="${esc(S.name)}" onchange="S.name=this.value.trim();upd();toast('Сохранено')"></div>
<div class="card glass" style="margin-top:14px"><h2>Оформление</h2><div class="row">${Object.keys(TH).map(k=>`<div style="text-align:center"><div class="sw ${S.theme===k?'on':''}" onclick="S.theme='${k}';upd()" style="background:linear-gradient(160deg,${{violet:'#2a1670,#a48be0',ocean:'#06284d,#6fc3e8',sunset:'#4a1240,#f2a06b',forest:'#07302a,#7cc9a0',mono:'#000,#4a4a4a',pastel:'#ffe4ef,#d2f4ea',beige:'#f6ecdd,#cdae8f',cocoa:'#1e130d,#8a6a4f'}[k]})"></div><div class="tg">${TH[k]}</div></div>`).join('')}</div></div>
<div class="card glass" style="margin-top:14px"><h2>Таймер (минуты)</h2><div class="row">${[['w','Работа'],['s','Перерыв'],['l','Длинный']].map(([k,n])=>`<label class="tg" style="flex:1">${n}<input type="number" min="1" max="120" value="${S.focus[k]}" onchange="S.focus.${k}=Math.min(120,Math.max(1,+this.value||1));resT();save()"></label>`).join('')}</div></div>`}};
function goalsHTML(){const w=Date.now()-7*864e5;return S.goals.map(g=>{let c=g.type==='tasks'?S.tasks.filter(t=>t.st===2&&t.doneTs>w).length:g.type==='focus'?Object.entries(S.focus.done).filter(([k])=>new Date(k)>w).reduce((a,[,v])=>a+v,0):g.cur,p=Math.min(100,Math.round(c/g.goal*100));return`<div style="margin-bottom:12px"><div class="row"><b style="flex:1">${esc(g.t)}</b><span class="tg">${c}/${g.goal}</span>${g.type==='manual'?`<button class="x" onclick="gp('${g.id}')">+1</button>`:''}<button class="x" onclick="S.goals=S.goals.filter(x=>x.id!=='${g.id}');upd()">✕</button></div><div class="bar" style="margin-top:6px"><i data-w="${p}"></i></div></div>`}).join('')||'<p class="sub">Целей нет.</p>'}
function gp(id){const g=S.goals.find(x=>x.id===id);g.cur++;upd()}
function tog(id){const t=S.tasks.find(x=>x.id===id);if(t.st===2){t.st=0;S.log[t.doneAt]=Math.max(0,(S.log[t.doneAt]||1)-1);delete t.doneAt}else{t.st=2;t.doneAt=today();t.doneTs=Date.now();S.log[t.doneAt]=(S.log[t.doneAt]||0)+1;toast('Отлично! Задание выполнено ✨')}upd()}
function delT(id){confirmM('Удалить задание?',()=>{const t=S.tasks.find(x=>x.id===id);if(t.doneAt)S.log[t.doneAt]=Math.max(0,S.log[t.doneAt]-1);S.tasks=S.tasks.filter(x=>x.id!==id);upd()})}
const opts=(a,sel)=>a.map(([v,n])=>`<option value="${v}" ${v==sel?'selected':''}>${esc(n)}</option>`).join(''),so=()=>S.subs.map(s=>[s.id,s.n]);
function taskForm(id){const t=S.tasks.find(x=>x.id===id)||{t:'',sub:S.subs[0]?.id,pr:1,st:0,date:today(),time:'',desc:''};window._e=id;modal(`<h2>${id?'Изменить':'Новое'} задание</h2><div class="f"><input id="f1" placeholder="Название" value="${esc(t.t)}"><select id="f2">${opts(so(),t.sub)}</select><textarea id="f3" placeholder="Описание" style="min-height:70px">${esc(t.desc)}</textarea><div class="row"><input id="f4" type="date" value="${t.date}" style="flex:1"><input id="f5" type="time" value="${t.time}" style="flex:1"></div><div class="row"><select id="f6" style="flex:1">${opts([[0,'Низкий'],[1,'Обычный'],[2,'Высокий']],t.pr)}</select><select id="f7" style="flex:1">${opts([[0,'Не начато'],[1,'В процессе'],[2,'Выполнено']],t.st)}</select></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeM()">Отмена</button><button class="btn p" onclick="saveT()">Сохранить</button></div></div>`)}
function saveT(){const n=$('#f1').value.trim();if(!n)return toast('Введите название');let t=S.tasks.find(x=>x.id===_e);if(!t){t={id:uid()};S.tasks.push(t)}const was=t.st;Object.assign(t,{t:n,sub:$('#f2').value,desc:$('#f3').value,date:$('#f4').value,time:$('#f5').value,pr:+$('#f6').value,st:+$('#f7').value});if(t.st===2&&was!==2){t.doneAt=today();t.doneTs=Date.now();S.log[t.doneAt]=(S.log[t.doneAt]||0)+1}else if(was===2&&t.st!==2&&t.doneAt){S.log[t.doneAt]=Math.max(0,S.log[t.doneAt]-1);delete t.doneAt}closeM();upd();toast('Сохранено')}
function schedForm(id){const x=S.sched.find(y=>y.id===id)||{d:sd,sub:S.subs[0]?.id,s:'09:00',e:'09:45'};window._e=id;modal(`<h2>Занятие</h2><div class="f"><select id="f1">${opts(so(),x.sub)}</select><select id="f2">${opts(DAYS.map((d,i)=>[i,d]),x.d)}</select><div class="row"><input id="f3" type="time" value="${x.s}" style="flex:1"><input id="f4" type="time" value="${x.e}" style="flex:1"></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeM()">Отмена</button><button class="btn p" onclick="saveS()">Сохранить</button></div></div>`)}
function saveS(){const s=$('#f3').value,e=$('#f4').value;if(!s||!e||e<=s)return toast('Время окончания должно быть позже начала');if(!$('#f1').value)return toast('Сначала добавьте предмет');let x=S.sched.find(y=>y.id===_e);if(!x){x={id:uid()};S.sched.push(x)}Object.assign(x,{sub:$('#f1').value,d:+$('#f2').value,s,e});sd=x.d;closeM();upd()}
function delS(id){confirmM('Удалить занятие?',()=>{S.sched=S.sched.filter(x=>x.id!==id);upd()})}
function subForm(id){const s=S.subs.find(x=>x.id===id)||{n:'',c:'#8b6cf0',d:''};window._e=id;modal(`<h2>Предмет</h2><div class="f"><input id="f1" placeholder="Название" value="${esc(s.n)}"><input id="f2" placeholder="Описание" value="${esc(s.d||'')}"><input id="f3" type="color" value="${s.c}" style="height:44px"><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeM()">Отмена</button><button class="btn p" onclick="saveSub()">Сохранить</button></div></div>`)}
function saveSub(){const n=$('#f1').value.trim();if(!n)return toast('Введите название');let s=S.subs.find(x=>x.id===_e);if(!s){s={id:uid()};S.subs.push(s)}Object.assign(s,{n,d:$('#f2').value,c:$('#f3').value});closeM();upd()}
function delSub(id){confirmM('Удалить предмет? Его занятия тоже удалятся.',()=>{S.subs=S.subs.filter(x=>x.id!==id);S.sched=S.sched.filter(x=>x.sub!==id);upd()})}
function noteForm(id){const n=S.notes.find(x=>x.id===id)||{t:'',b:'',sub:S.subs[0]?.id};window._e=id;modal(`<h2>Заметка</h2><div class="f"><input id="f1" placeholder="Заголовок" value="${esc(n.t)}"><select id="f2">${opts(so(),n.sub)}</select><textarea id="f3" placeholder="Текст">${esc(n.b)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeM()">Отмена</button><button class="btn p" onclick="saveN()">Сохранить</button></div></div>`)}
function saveN(){const t=$('#f1').value.trim();if(!t)return toast('Введите заголовок');let n=S.notes.find(x=>x.id===_e);if(!n){n={id:uid(),pin:0};S.notes.push(n)}Object.assign(n,{t,sub:$('#f2').value,b:$('#f3').value,at:Date.now()});closeM();go('notes');save()}
function pinN(id){const n=S.notes.find(x=>x.id===id);n.pin=n.pin?0:1;upd()}function delN(id){confirmM('Удалить заметку?',()=>{S.notes=S.notes.filter(x=>x.id!==id);upd()})}
function goalForm(){modal(`<h2>Новая цель</h2><div class="f"><input id="f1" placeholder="Например: 15 заданий за неделю"><select id="f2"><option value="tasks">Считать выполненные задания</option><option value="focus">Считать сессии фокуса</option><option value="manual">Вести вручную</option></select><input id="f3" type="number" min="1" value="5"><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeM()">Отмена</button><button class="btn p" onclick="const t=$('#f1').value.trim();if(!t)return toast('Введите название');S.goals.push({id:uid(),t,type:$('#f2').value,goal:Math.max(1,+$('#f3').value||1),cur:0});closeM();upd()">Создать</button></div></div>`)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='studyflow.json';a.click();toast('Экспортировано')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.subs)||!Array.isArray(d.notes)||!d.focus)throw 0;S=Object.assign(def(),d);S.onb=true;upd();toast('Данные импортированы')}catch(e){toast('Файл повреждён или не подходит')}};r.readAsText(f)}
const T={m:'w',left:null,run:false,end:0,id:null};T.left=S.focus.w*60;
function setM(m){clearInterval(T.id);T.m=m;T.run=false;T.left=S.focus[m]*60;render()}
function resT(){clearInterval(T.id);T.run=false;T.left=S.focus[T.m]*60;if(page==='focus')render()}
function togT(){if(T.run){clearInterval(T.id);T.run=false;T.left=Math.max(0,Math.round((T.end-Date.now())/1000))}else{T.run=true;T.end=Date.now()+T.left*1000;clearInterval(T.id);T.id=setInterval(tick,250)}drawT()}
function tick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));if(T.left<=0){clearInterval(T.id);T.run=false;if(T.m==='w'){const d=today();S.focus.done[d]=(S.focus.done[d]||0)+1;save();toast('Сессия завершена! Время отдохнуть 🎉');T.m='s'}else{toast('Перерыв окончен');T.m='w'}T.left=S.focus[T.m]*60;if(page==='focus')render();return}drawT()}
function drawT(){const e=$('#tm');if(!e)return;const tot=S.focus[T.m]*60,l=T.run?Math.max(0,Math.round((T.end-Date.now())/1000)):T.left;e.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');$('#rp').style.strokeDashoffset=678.6*(1-(tot-l)/tot);$('#ts').textContent=T.run?'Пауза':(l<tot?'Продолжить':'Старт');document.title=T.run?e.textContent+' · StudyFlow':'StudyFlow'}
function onboard(){let st=0;modal(`<h2>Привет! Давай знакомиться</h2><p class="sub" style="margin-bottom:12px">Как тебя зовут и какое настроение выберешь? Всё можно поменять потом.</p><div class="f"><input id="f1" placeholder="Твоё имя"><div class="row">${Object.keys(TH).map(k=>`<button class="pill" onclick="S.theme='${k}';applyTheme()">${TH[k]}</button>`).join('')}</div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="S.onb=true;closeM();upd()">Пропустить</button><button class="btn p" onclick="S.name=$('#f1').value.trim();S.onb=true;closeM();upd()">Начать</button></div></div>`)}
document.addEventListener('visibilitychange',()=>{if(T.run)tick()});
render();if(!S.onb)onboard();
</script></body></html>
